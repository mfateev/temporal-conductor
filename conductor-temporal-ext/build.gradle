plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'io.temporal.conductor'
version = '1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withJavadocJar()
    withSourcesJar()
}

repositories {
    mavenCentral()
}

dependencies {
    // Conductor dependencies - exposed as API
    api 'org.conductoross:conductor-core:3.21.23'
    api 'org.conductoross:conductor-common:3.21.23'

    // Temporal SDK - exposed as API for workflow implementations
    api 'io.temporal:temporal-sdk:1.25.0'

    // Jackson for JSON serialization
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.3'

    // Logging
    implementation 'org.slf4j:slf4j-api:2.0.9'

    // Testing
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'io.temporal:temporal-testing:1.25.0'
    testImplementation 'ch.qos.logback:logback-classic:1.4.14'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            artifactId = 'conductor-temporal-ext'
        }
    }
}
