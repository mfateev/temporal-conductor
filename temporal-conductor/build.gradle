plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.2'
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'io.temporal.conductor'
version = '1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}

dependencies {
    // Conductor dependencies
    implementation 'org.conductoross:conductor-core:3.21.23'
    implementation 'org.conductoross:conductor-common:3.21.23'

    // Conductor extension tasks (auto-discovered via Spring)
    implementation 'org.conductoross:conductor-json-jq-task:3.21.23'

    // RxJava (required for Conductor's ObservableQueue interface)
    implementation 'io.reactivex:rxjava:1.3.8'

    // Temporal SDK with Spring Boot integration
    implementation 'io.temporal:temporal-spring-boot-starter:1.25.0'

    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // OpenAPI documentation
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0'

    // Caching
    implementation 'com.github.ben-manes.caffeine:caffeine:3.1.8'

    // Jackson
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.3'

    // Logging
    implementation 'org.slf4j:slf4j-api:2.0.9'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.temporal:temporal-testing:1.25.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'org.mockito:mockito-core:5.8.0'
    testImplementation 'ch.qos.logback:logback-classic:1.4.14'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}
