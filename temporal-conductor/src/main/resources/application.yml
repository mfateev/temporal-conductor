server:
  port: 8080

spring:
  profiles:
    active: stub  # Use stub by default
  application:
    name: conductor-server-temporal
  jackson:
    default-property-inclusion: non_null

logging:
  level:
    io.temporal.conductor: DEBUG
    org.springframework.web: INFO

# Actuator endpoints for health checks and metrics
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  # Disable all external metric exporters
  datadog:
    metrics:
      export:
        enabled: false
  newrelic:
    metrics:
      export:
        enabled: false
  atlas:
    metrics:
      export:
        enabled: false
  stackdriver:
    metrics:
      export:
        enabled: false
  wavefront:
    metrics:
      export:
        enabled: false
  influx:
    metrics:
      export:
        enabled: false
  signalfx:
    metrics:
      export:
        enabled: false
  dynatrace:
    metrics:
      export:
        enabled: false
  humio:
    metrics:
      export:
        enabled: false
  kairos:
    metrics:
      export:
        enabled: false
  appoptics:
    metrics:
      export:
        enabled: false
  elastic:
    metrics:
      export:
        enabled: false
  ganglia:
    metrics:
      export:
        enabled: false
  graphite:
    metrics:
      export:
        enabled: false
  jmx:
    metrics:
      export:
        enabled: false
  statsd:
    metrics:
      export:
        enabled: false

# Temporal configuration (for non-stub mode)
# Standard Temporal env vars (TEMPORAL_ADDRESS, TEMPORAL_NAMESPACE) take precedence
temporal:
  namespace: conductor
  service-address: localhost:7234
  task-queue: conductor-workflows

# Swagger/OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
