description = 'Temporal Conductor - Core library for executing Conductor workflows on Temporal'

dependencies {
    // Temporal SDK
    api "io.temporal:temporal-sdk:${temporalVersion}"

    // Conductor API models (using published version from Maven Central)
    implementation "com.netflix.conductor:conductor-common:3.15.0"
    implementation "com.netflix.conductor:conductor-core:3.15.0"

    // Jackson for JSON serialization
    implementation "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
    implementation "com.fasterxml.jackson.core:jackson-core:${jacksonVersion}"
    implementation "com.fasterxml.jackson.core:jackson-annotations:${jacksonVersion}"
    implementation "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:${jacksonVersion}"

    // Guava
    implementation "com.google.guava:guava:${guavaVersion}"

    // Logging
    implementation "org.slf4j:slf4j-api:${slf4jVersion}"
    testImplementation "ch.qos.logback:logback-classic:${logbackVersion}"

    // Testing
    testImplementation "junit:junit:${junitVersion}"
    testImplementation "org.mockito:mockito-core:${mockitoVersion}"
    testImplementation "io.temporal:temporal-testing:${temporalVersion}"
}
